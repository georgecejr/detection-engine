name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy detections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package detections
        run: |
          mkdir -p dist
          tar -czf dist/detections.tar.gz sigma sql samples
          echo "Packaged Sigma rules, SQL detections, and samples."
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: detections
          path: dist/detections.tar.gz

      - name: Deploy
        run: |
          echo "Deploy step is a placeholder."
          echo "Wire this job to your SIEM, detection platform, or object store."
