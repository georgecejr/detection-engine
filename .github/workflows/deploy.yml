name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy detections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup RunReveal CLI
        run: |
          curl -L https://github.com/runreveal/homebrew-runreveal/releases/latest/download/runreveal-linux-amd64.tar.gz \
            -o runreveal-linux-amd64.tar.gz
          tar -xvf runreveal-linux-amd64.tar.gz
          chmod +x runreveal
          rm runreveal-linux-amd64.tar.gz

      - name: Configure RunReveal
        run: |
          ./runreveal configure --api-key "${{ secrets.RUNREVEAL_TOKEN }}"

      - name: Deploy detections
        run: |
          ./runreveal detections sync -d ./sql
