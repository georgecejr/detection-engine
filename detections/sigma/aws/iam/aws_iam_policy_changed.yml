title: AWS IAM Policy Changed
id: e1ff68e8-2c89-4d7d-9140-6d580aadf8c1
status: experimental
description: Detects create, attach, or update operations on IAM policies.
author: detection-engine
date: 2026/08/18
logsource:
  product: aws
  service: iam
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - CreatePolicy
      - CreatePolicyVersion
      - AttachUserPolicy
      - AttachRolePolicy
      - AttachGroupPolicy
      - PutUserPolicy
      - PutRolePolicy
      - PutGroupPolicy
  condition: selection
falsepositives:
  - Infrastructure-as-code policy updates
level: medium
tags:
  - attack.privilege_escalation
  - attack.t1098
